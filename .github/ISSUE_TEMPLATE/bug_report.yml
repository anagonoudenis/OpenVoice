name: Bug report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search
        [existing issues](../../issues) first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. Include the exact error message/traceback if there is one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug. Include relevant config (provider choices, env vars with secrets redacted).
      placeholder: |
        1. Set `LLM_PROVIDER=...`
        2. Run `...`
        3. See error
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Affected area
      description: e.g. "LLM providers", "telephony worker", "REST API", "Alembic migrations"
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Commit / version
      description: Output of `git rev-parse HEAD`, or the release tag.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version (`python --version`), `uv --version`, Docker version if relevant.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Structured log output (redact secrets/PII first). This will be rendered as a code block.
      render: shell
    validations:
      required: false
