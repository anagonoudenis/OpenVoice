[project]
name = "openvoice"
version = "0.1.0"
description = "Open-source AI voice agent for phone calls, appointment booking, and customer support."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "OpenVoice Contributors" }]

# Core dependencies required to run the API, DB layer, and LLM orchestration.
# Heavy/optional stacks (real-time voice, calendar, notifications) live in
# [project.optional-dependencies] below so a plain `uv sync` stays fast and
# contributors only pull in the pieces they're actually working on.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "celery>=5.4",
    "tenacity>=9.0",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.18",
    "prometheus-client>=0.21",
    "anthropic>=0.40",
    "openai>=1.57",
    "httpx>=0.28",
    "pgvector>=0.3.6",
    "numpy>=2.1",
]

[project.optional-dependencies]
# Real-time telephony/voice pipeline: LiveKit, STT, TTS, VAD.
voice = [
    "livekit-agents>=0.12",
    "livekit-plugins-silero>=0.7",
    "faster-whisper>=1.1",
    "piper-tts>=1.2",
]
# Calendar integrations (Google Calendar first; Outlook/Cal.com later).
calendar = [
    "google-api-python-client>=2.154",
    "google-auth>=2.36",
    "google-auth-oauthlib>=1.2",
]
# SMS/email notification providers.
notifications = [
    "twilio>=9.4",
    "resend>=2.5",
]
# Everything, for full local dev.
all = ["openvoice[voice,calendar,notifications]"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.35",
    "pre-commit>=4.0",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openvoice"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # flake8-bugbear
    "C4",               # flake8-comprehensions
    "SIM",              # flake8-simplify
    "ASYNC",            # flake8-async
    "RUF",              # ruff-specific
    "N",                # pep8-naming
    "S",                # flake8-bandit (security)
    "TID",              # flake8-tidy-imports
]
ignore = [
    "S101", # allow assert (pytest)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["openvoice"]

# ---------------------------------------------------------------------------
# mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "livekit.*", "faster_whisper.*", "piper.*", "alembic.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=openvoice --cov-report=term-missing --cov-report=xml"
markers = [
    "integration: requires a real PostgreSQL database (see tests/integration/conftest.py)",
]

[tool.coverage.run]
source = ["src/openvoice"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
